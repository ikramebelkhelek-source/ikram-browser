name: Transfer profile backups between clean phones

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-backup-transfer.yml"
      - ".github/actions/prepare-android/**"
  pull_request:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-backup-transfer.yml"
      - ".github/actions/prepare-android/**"

permissions:
  contents: read

concurrency:
  group: backup-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Export on clean source phone (Android 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore disposable test APKs for unchanged application source
        id: apks
        uses: actions/cache/restore@v4
        with:
          path: |
            flutter/ikram_browser/build/app/outputs/flutter-apk/app-debug.apk
            flutter/ikram_browser/build/backup_editor/outputs/apk/debug/backup_editor-debug.apk
          key: backup-debug-apks-${{ runner.os }}-${{ hashFiles('flutter/ikram_browser/lib/**', 'flutter/ikram_browser/pubspec.*', 'flutter/ikram_browser/packages/**', 'flutter/ikram_browser/tool/backup_editor/**', 'flutter/ikram_browser/tool/configure_backup_editor.py', 'flutter/ikram_browser/tool/configure_update_probe.py', '.github/actions/prepare-android/**', '.github/workflows/android-backup-transfer.yml') }}
      - name: Build browser and independent synthetic editor with disposable keys
        if: steps.apks.outputs.cache-hit != 'true'
        working-directory: flutter/ikram_browser
        run: |
          python3 tool/configure_backup_editor.py
          flutter build apk --debug --no-pub
          cd android
          ./gradlew :backup_editor:assembleDebug
          # The build daemon is not needed while two native apps and Chromium
          # run inside the emulator; release its heap before device verification.
          ./gradlew --stop
      - name: Cache only disposable APKs, never signing material
        if: steps.apks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            flutter/ikram_browser/build/app/outputs/flutter-apk/app-debug.apk
            flutter/ikram_browser/build/backup_editor/outputs/apk/debug/backup_editor-debug.apk
          key: ${{ steps.apks.outputs.cache-primary-key }}
      - name: Stage the exact same disposable APKs for the other phone
        run: |
          mkdir -p generated-artifacts/backup-test-apks
          cp flutter/ikram_browser/build/app/outputs/flutter-apk/app-debug.apk generated-artifacts/backup-test-apks/browser.apk
          cp flutter/ikram_browser/build/backup_editor/outputs/apk/debug/backup_editor-debug.apk generated-artifacts/backup-test-apks/editor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: backup-test-apks-${{ github.run_number }}
          path: generated-artifacts/backup-test-apks/
          retention-days: 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export on clean source phone using Android clipboard and document picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: backup-source
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: python3 flutter/ikram_browser/tool/verify_backup_transfer.py source flutter/ikram_browser/build/app/outputs/flutter-apk/app-debug.apk flutter/ikram_browser/build/backup_editor/outputs/apk/debug/backup_editor-debug.apk
      - name: Transfer only the two validated configuration documents
        uses: actions/upload-artifact@v4
        with:
          name: backup-documents-${{ github.run_number }}
          path: generated-artifacts/backup-transfer/exchange/
          if-no-files-found: error
          retention-days: 7
      - name: Retain source-phone evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-backup-transfer-source-${{ github.run_number }}
          path: generated-artifacts/backup-transfer/source/
          if-no-files-found: error
          retention-days: 7

  destination:
    name: Restore on a separate clean phone (Android 35, Arabic 320dp)
    needs: source
    # A new runner as well as a wiped AVD: no source VM, preferences, browser
    # data, build daemon or emulator process can leak into the destination.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: backup-test-apks-${{ github.run_number }}
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: backup-documents-${{ github.run_number }}
          path: generated-artifacts/backup-transfer/exchange
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import on a different clean phone, cancel, conflict, restart and compare
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: backup-destination
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: python3 flutter/ikram_browser/tool/verify_backup_transfer.py destination apks/browser.apk apks/editor.apk
      - name: Retain destination-phone evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-backup-transfer-destination-${{ github.run_number }}
          path: generated-artifacts/backup-transfer/destination/
          if-no-files-found: error
          retention-days: 7
