name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-apk.yml"
      - ".github/actions/prepare-android/**"
  pull_request:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-apk.yml"
      - ".github/actions/prepare-android/**"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check Flutter source (no signing secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          dart tool/check_domain.dart
          python3 -m unittest discover -s tool/tests -v
        working-directory: flutter/ikram_browser

  build:
    name: Signed APK ${{ matrix.sequence }}
    needs: checks
    # Never expose the key to PR code, including same-repository pull requests.
    # The environment additionally restricts which branches may use secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        sequence: [1, 2]
    defaults:
      run:
        working-directory: flutter/ikram_browser
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - name: Restore protected signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tool/configure_ci_signing.py
      - name: Build with a monotonically increasing version
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Two separate fresh runners, each restoring the same protected key.
          flutter build apk --debug --no-pub \
            --build-number="$((GITHUB_RUN_NUMBER * 2 + ${{ matrix.sequence }}))"
      - name: Verify certificate and prepare APK
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/download
          "$build_tools/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk \
            > "$RUNNER_TEMP/apk-certificate.txt"
          python3 tool/verify_apk_certificate.py "$RUNNER_TEMP/apk-certificate.txt"
          cp build/app/outputs/flutter-apk/app-debug.apk build/download/ikram-browser-debug.apk
          (cd build/download && sha256sum ikram-browser-debug.apk > SHA256SUMS.txt)
      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ikram-ci-signing.jks" "$RUNNER_TEMP/apk-certificate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ matrix.sequence }}-${{ github.run_number }}
          path: flutter/ikram_browser/build/download/
          if-no-files-found: error
          retention-days: 1

  verify-update:
    name: Verify update preserves installed data
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-1-${{ github.run_number }}
          path: apks/first
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-2-${{ github.run_number }}
          path: apks/second
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare certificates and update on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash flutter/ikram_browser/tool/verify_android_update.sh apks/first/ikram-browser-debug.apk apks/second/ikram-browser-debug.apk
      # Only advertise/download the newer APK after the update test passes.
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ikram-browser-debug-${{ github.run_number }}
          path: apks/second/
          if-no-files-found: error
          retention-days: 30
      - name: Show safe update instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Android update verified"
            echo "[Download the tested APK]($ARTIFACT_URL)"
            echo "Two fresh runners used the same certificate; Android accepted an in-place update and retained the test app data."
            echo "Unzip and install ikram-browser-debug.apk OVER the existing app. Do not uninstall or clear storage."
            echo "Legacy APKs with a different signing certificate cannot be updated by this key. Stop if Android rejects the update."
            echo "This remains a debuggable test build, not an app-store release. Artifacts are kept for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"
