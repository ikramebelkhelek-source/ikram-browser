name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      extended_checks:
        description: Run slower backup-runtime and emulator migration checks
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-apk.yml"
      - ".github/actions/prepare-android/**"
  pull_request:
    paths:
      - "flutter/ikram_browser/**"
      - ".github/workflows/android-apk.yml"
      - ".github/actions/prepare-android/**"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check Flutter source (no signing secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - name: Analyze Flutter source
        timeout-minutes: 3
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        working-directory: flutter/ikram_browser
      - name: Run bounded Flutter unit and widget tests
        timeout-minutes: 4
        run: timeout --kill-after=15s 180s flutter test --timeout 30s
        working-directory: flutter/ikram_browser
      - name: Check domain and workflow tools
        timeout-minutes: 3
        run: |
          dart tool/check_domain.dart
          python3 -m unittest discover -s tool/tests -v
          node --test tool/tests/*.test.mjs
          for script in tool/*.sh; do bash -n "$script" || exit; done
        working-directory: flutter/ikram_browser

  backup-runtime-checks:
    name: Extended backup document runtime checks
    needs: checks
    if: inputs.extended_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - name: Check Android backup document access (API 24 and 35 runtimes)
        timeout-minutes: 6
        run: ./gradlew --no-daemon --console=plain :profile_backup_documents:testDebugUnitTest
        working-directory: flutter/ikram_browser/android
      - name: Retain native backup check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-document-checks
          path: flutter/ikram_browser/build/profile_backup_documents/reports/tests/
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Signed APK ${{ matrix.sequence }}
    needs: checks
    # Never expose the key to PR code, including same-repository pull requests.
    # The environment additionally restricts which branches may use secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # Fast builds need only the final APK. Extended verification needs a pair.
        sequence: ${{ fromJSON(inputs.extended_checks == true && '[1, 2]' || '[2]') }}
    defaults:
      run:
        working-directory: flutter/ikram_browser
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - name: Restore protected signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tool/configure_ci_signing.py
      - name: Build with a monotonically increasing version
        timeout-minutes: 18
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Two separate fresh runners, each restoring the same protected key.
          flutter build apk --debug --no-pub \
            --build-number="$((GITHUB_RUN_NUMBER * 2 + ${{ matrix.sequence }}))"
      - name: Verify certificate and prepare APK
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/download
          cp build/app/outputs/flutter-apk/app-debug.apk build/download/ikram-browser-debug.apk
          (cd build/download && sha256sum ikram-browser-debug.apk > SHA256SUMS.txt)
          "$build_tools/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk \
            > "$RUNNER_TEMP/apk-certificate.txt"
          python3 tool/verify_apk_certificate.py "$RUNNER_TEMP/apk-certificate.txt"
      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ikram-ci-signing.jks" "$RUNNER_TEMP/apk-certificate.txt"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('flutter/ikram_browser/build/download/ikram-browser-debug.apk') != ''
        with:
          name: signed-apk-${{ matrix.sequence }}-${{ github.run_number }}
          path: flutter/ikram_browser/build/download/
          if-no-files-found: error
          retention-days: 1

  retain-baseline:
    name: Retain the original historical APK (no signing secrets)
    outputs:
      available: ${{ steps.retain.outputs.available }}
    needs: checks
    if: >-
      inputs.extended_checks == true &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    # Only this trusted maintenance job may upload CI fixture assets. It never
    # enters the signing environment and never handles the permanent key.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preserve or verify the pinned original binary
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if bash flutter/ikram_browser/tool/retain_android_baseline.sh; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 4 ]; then
              echo "::warning::Historical APK retention is unavailable (exit 4). Skipping the optional historical migration check."
              echo "available=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Historical APK unavailable"
                echo "Optional historical migration coverage was skipped, not passed."
                echo "Extended mode still requires signing and supported-device update checks."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Historical APK retention or integrity verification failed (exit $status)."
              exit "$status"
            fi
          fi

  build-test:
    name: Disposable-key APKs (no protected secrets)
    needs: checks
    if: inputs.extended_checks == true
    # The separate provider-change lane never uses
    # protected-key APKs or enters the signing environment.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter/ikram_browser
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-android
      - name: Build an update pair using only the disposable runner debug key
        run: |
          set -euo pipefail
          for sequence in 1 2; do
            flutter build apk --debug --no-pub --build-number="$sequence"
            mkdir -p "build/test-$sequence"
            cp build/app/outputs/flutter-apk/app-debug.apk "build/test-$sequence/ikram-browser-debug.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk-1-${{ github.run_number }}
          path: flutter/ikram_browser/build/test-1/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk-2-${{ github.run_number }}
          path: flutter/ikram_browser/build/test-2/
          retention-days: 1

  verify-update:
    name: Verify update on Android API ${{ matrix.api }}
    needs: [build, build-test]
    if: >-
      always() && !cancelled() && inputs.extended_checks == true &&
      (needs.build.result == 'success' || needs.build-test.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Flutter 3.35.7's generated Android shell has minSdk 24.
        api: [24, 28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.result == 'success' && 'signed' || 'test' }}-apk-1-${{ github.run_number }}
          path: apks/first
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.result == 'success' && 'signed' || 'test' }}-apk-2-${{ github.run_number }}
          path: apks/second
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare certificates and update on Android
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          script: bash flutter/ikram_browser/tool/verify_android_update.sh apks/first/ikram-browser-debug.apk apks/second/ikram-browser-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-update-evidence-api-${{ matrix.api }}-${{ github.run_number }}
          path: generated-artifacts/android-update/
          if-no-files-found: ignore
          retention-days: 1

  verify-webview-update:
    name: Verify data across a System WebView change (disposable keys only)
    needs: build-test
    if: inputs.extended_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: test-apk-1-${{ github.run_number }}
          path: apks/first
      - uses: actions/download-artifact@v4
        with:
          name: test-apk-2-${{ github.run_number }}
          path: apks/second
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Get a standalone x86_64 provider from Google's SDK system image rather
      # than an APK mirror. This donor has no app data or accounts.
      - name: Collect the API 29 AOSP provider on a separate disposable emulator
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          avd-name: webview-donor
          disable-animations: true
          emulator-boot-timeout: 180
          script: bash flutter/ikram_browser/tool/collect_webview_provider.sh
      - name: Seed, change provider, read original data, then update app
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          avd-name: webview-migration
          disable-animations: true
          emulator-boot-timeout: 180
          script: bash flutter/ikram_browser/tool/verify_webview_update.sh apks/first/ikram-browser-debug.apk apks/second/ikram-browser-debug.apk
      - name: Report provider-change result without treating unsupported as passed
        if: always()
        run: python3 flutter/ikram_browser/tool/report_webview_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webview-update-evidence-${{ github.run_number }}
          path: generated-artifacts/android-webview-update/
          if-no-files-found: error
          retention-days: 1

  publish-tested-apk:
    name: Publish signed APK with verification summary
    needs: [build, verify-update, retain-baseline, verify-historical-update, backup-runtime-checks]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (inputs.extended_checks != true ||
       (needs.backup-runtime-checks.result == 'success' &&
        needs.verify-update.result == 'success' &&
        needs.retain-baseline.result == 'success' &&
        (needs.verify-historical-update.result == 'success' ||
         (needs.retain-baseline.outputs.available == 'false' &&
          needs.verify-historical-update.result == 'skipped'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-2-${{ github.run_number }}
          path: apks/second
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ikram-browser-debug-${{ github.run_number }}
          path: apks/second/
          if-no-files-found: error
          retention-days: 30
      - name: Show safe update instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HISTORICAL_RESULT: ${{ needs.verify-historical-update.result }}
          EXTENDED_CHECKS: ${{ inputs.extended_checks == true }}
        run: |
          {
            if [ "$EXTENDED_CHECKS" = true ]; then
              echo "## Android update verified"
              echo "Two fresh runners used the same certificate. APIs 24, 28 and 35 accepted in-place updates, displayed the saved profiles, and retained real HTTPS-origin WebView cookies/localStorage."
              echo "A differently signed update was rejected without changing installed data on each API."
              if [ "$HISTORICAL_RESULT" = success ]; then
                echo "The retained versionCode 30 APK also passed a cross-revision update on API 35, retaining profiles and HTTPS cookies/localStorage without reseeding, including a second cold start."
              else
                echo "**Historical migration check skipped: the original APK could not be retained. This is not a historical-migration pass.**"
              fi
            else
              echo "## Signed APK — fast build"
              echo "Source analysis, bounded unit/widget/tool tests, and APK signing verification passed."
              echo "**Extended checks skipped:** native backup-runtime, device update, historical migration, and WebView migration checks were not run. This download does not certify backup transfer or browsing-data preservation."
              echo "For extended verification, run this workflow manually with Extended checks enabled."
            fi
            echo "[Download APK]($ARTIFACT_URL)"
            echo "Unzip and install ikram-browser-debug.apk OVER the existing app. Do not uninstall or clear storage."
            echo "Legacy APKs with a different signing certificate cannot be updated by this key. Stop if Android rejects the update."
            echo "This remains a debuggable test build, not an app-store release. Artifacts are kept for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-historical-update:
    name: Verify retained release to current source (Android API 35)
    needs: [build, retain-baseline]
    if: >-
      always() && !cancelled() && inputs.extended_checks == true &&
      needs.build.result == 'success' && needs.retain-baseline.result == 'success' &&
      needs.retain-baseline.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch the pinned earlier release without rebuilding or re-signing
        run: python3 flutter/ikram_browser/tool/android_baseline.py fetch apks/baseline/ikram-browser-debug.apk
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-2-${{ github.run_number }}
          path: apks/current
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # This original APK predates explicit inspection support on old WebViews.
      # API 35 auto-enables inspection for debuggable apps. Do not patch/re-sign
      # the baseline to make old APIs inspectable: keep its historical bytes.
      - name: Seed in the earlier app and verify current app without reseeding
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          script: bash flutter/ikram_browser/tool/verify_android_update.sh apks/baseline/ikram-browser-debug.apk apks/current/ikram-browser-debug.apk flutter/ikram_browser/tool/android-update-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-historical-update-evidence-${{ github.run_number }}
          path: generated-artifacts/android-update/
          if-no-files-found: ignore
          retention-days: 1
