name: Verify existing Android APK pair
on:
  workflow_dispatch:
  push:
    branches: [ci/stable-android-updates]
    paths: [".github/workflows/verify-update-temporary.yml", "flutter/ikram_browser/tool/verify_android_update.sh"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-1-6
          run-id: 43293675940
          github-token: ${{ github.token }}
          path: apks/first
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-2-6
          run-id: 43293675940
          github-token: ${{ github.token }}
          path: apks/second
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash flutter/ikram_browser/tool/verify_android_update.sh apks/first/ikram-browser-debug.apk apks/second/ikram-browser-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-update-screenshot
          path: generated-artifacts/android-update.png
          retention-days: 1
